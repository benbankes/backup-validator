- name: Initialize host_vars from template
  hosts: all
  gather_facts: false
  connection: local
  vars:
    template_file: "host_vars/example.com.yml.example"

  tasks:
    - name: Copy template to host-specific directory
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/{{ template_file }}"
        dest: "{{ playbook_dir }}/host_vars/{{ inventory_hostname }}.yml"
        force: false  # Prevent overwriting existing files with filled-in values
        mode: '0644'
      delegate_to: localhost
