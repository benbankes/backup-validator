# This playbook can be used to terminate teh EC2 instance which performs backups

# --- Dynamic AWS Discovery Block ---
- name: Discover active backup orchestrator IP from AWS API
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aws_region: "us-east-1"
    tag_name: "backup_creator_tag"
  tasks:
    - ansible.builtin.include_tasks: tasks/discover-ip.yml

- name: Destroy backup machine
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Get running instances
      amazon.aws.ec2_instance_info:
        region: us-east-1
        filters:
          "tag:Name": backup_creator_tag
          "instance-state-name": running
      register: ec2

    - name: Terminate first instance (should only be one)
      amazon.aws.ec2_instance:
        region: us-east-1
        state: absent
        instance_ids: "{{[ec2.instances[0].instance_id]}}"
        wait: true
