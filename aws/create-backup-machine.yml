# This playbook can be used to create a new EC2 instance which will perform backups

# Create backup machine at aws with tag
- name: Create backup machine
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aws_region: "us-east-1"
    #aws_zone: "us-east-1f"
    subnet_id: "subnet-31b23e3d"
    key_name: "MyEc2KeyPair"
    security_group: "SshSecurityGroup"
    instance_type: "c6i.large"
    iam_profile: "s3-admin-access"
    tag_name: "backup_creator_tag"

  tasks:
    - name: Fetch latest official Ubuntu 26.04 Minimal AMI
      amazon.aws.ec2_ami_info:
        region: "{{ aws_region }}"
        owners: ["099720109477"]  # Official Canonical AWS Account ID
        filters:
          name: "ubuntu-minimal/images/hvm-ssd-gp3/ubuntu-resolute-26.04-amd64-minimal-*"
          architecture: "x86_64"
          state: "available"
      register: ubuntu_ami

    - name: Set target AMI ID fact
      ansible.builtin.set_fact:
        target_ami: "{{ ubuntu_ami.images | sort(attribute='creation_date') | last }}"

    - name: Provision an EC2 instance
      amazon.aws.ec2_instance:
        region: "{{ aws_region }}"
        vpc_subnet_id: "{{ subnet_id }}"
        key_name: "{{ key_name }}"
        security_groups: "{{ security_group }}"
        instance_type: "{{ instance_type }}"
        image_id: "{{ target_ami.image_id }}"
        wait: true
        exact_count: 1
        filters:
          tag:Name: "{{ tag_name }}"
          instance-state-name: [running, pending]
        tags:
          Name: "{{ tag_name }}"
        network_interfaces:
          - device_index: 0
            assign_public_ip: true
        iam_instance_profile: "{{ iam_profile }}"
        volumes:
          - device_name: /dev/sda1
            ebs:
              volume_type: gp3
              volume_size: 100
              delete_on_termination: true
              throughput: 125  # Matches the 12.5 Gbps network pipe of c6i.large
              iops: 3000       # Prevents disk bottlenecks during processing
      register: ec2_result

    - name: Add instance to dynamic in-memory inventory
      ansible.builtin.add_host:
        name: "{{ item.public_ip_address }}"
        groups: mine
        ansible_user: ubuntu
        ansible_ssh_private_key_file: "~/.ssh/personal-aws/MyEc2KeyPair.pem"
      loop: "{{ ec2_result.instances }}"
      when: item.public_ip_address is defined

- name: Validate and configure backup node
  hosts: mine
  gather_facts: false
  tasks:
    - name: Wait for authenticated SSH handshake to clear
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 300
