---
- name: Validate discovery settings and account
  ansible.builtin.include_tasks: ../../tasks/validate-aws-settings.yml
  vars:
    aws_required_settings: [tag_name, ansible_ssh_private_key_file]

- name: Query active instance configurations
  amazon.aws.ec2_instance_info:
    region: "{{ aws_region }}"
    filters:
      tag:Name: "{{ tag_name }}"
      instance-state-name: [running, pending]
  register: aws_lookup

- name: Require exactly one reachable backup machine
  ansible.builtin.assert:
    that:
      - aws_lookup.instances | length == 1
      - aws_lookup.instances[0].public_ip_address is defined
    fail_msg: Expected exactly one pending/running backup machine with a public IP for the configured tag.

- name: Map discovered cloud properties to memory inventory
  ansible.builtin.add_host:
    name: "{{ item.public_ip_address }}"
    groups: mine
    ansible_user: ubuntu
    ansible_ssh_private_key_file: "{{ ansible_ssh_private_key_file }}"
  loop: "{{ aws_lookup.instances }}"
  when: item.public_ip_address is defined
