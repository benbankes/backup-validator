# This playbook can be used to create a backup of the files and database of a website

- name: Grant remote access to machines from which backups are being taken
  hosts: all
  gather_facts: false
  tasks:
    - name: Ensure backup server has credentials to the machine from which the backups are being taken
      ansible.builtin.authorized_key:
        user: "{{ ansible_user }}"
        state: present
        key: "{{ lookup('ansible.builtin.file', '/home/ubuntu/.ssh/id_rsa.pub') }}"

- name: Backup site
  hosts: all
  gather_facts: false

  tasks:
    - name: Ensure orchestrator host-isolated download folder is clean
      ansible.builtin.file:
        path: "/home/ubuntu/flextalk-ansible-backups/{{ inventory_hostname }}"
        state: absent
      delegate_to: localhost

    - name: Clear old staging directories on target server
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/ansible-backup-archives"
        state: absent

    - name: Create fresh staging directories on target server
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/ansible-backup-archives"
        state: directory
        mode: "0755"

    - name: Generate production database snapshot safely
      ansible.builtin.command: >
        mysqldump {{ mysql_database }}
        --host={{ mysql_host }}
        --user={{ mysql_user }}
        --result-file=/home/{{ ansible_user }}/ansible-backup-archives/database.sql
      environment:
        MYSQL_PWD: "{{ mysql_pass }}"

    - name: Archive website assets directly (skipping permission-locked files)
      ansible.builtin.command: >
        tar -czf /home/{{ ansible_user }}/ansible-backup-archives/site-files.tar.gz
        --ignore-failed-read
        -C /home/{{ ansible_user }}
        {{ inventory_hostname }}
      register: tar_result
      failed_when: tar_result.rc not in [0, 1]

    - name: Pull database backup back to the orchestrator instance
      ansible.builtin.fetch:
        src: "/home/{{ ansible_user }}/ansible-backup-archives/database.sql"
        dest: "/home/ubuntu/flextalk-ansible-backups/{{ inventory_hostname }}/database.sql"
        flat: true

    - name: Pull site assets archive back to the orchestrator instance
      ansible.builtin.fetch:
        src: "/home/{{ ansible_user }}/ansible-backup-archives/site-files.tar.gz"
        dest: "/home/ubuntu/flextalk-ansible-backups/{{ inventory_hostname }}/site-files.tar.gz"
        flat: true

    - name: Collect timestamp facts from orchestrator environment
      ansible.builtin.setup:
        filter: "ansible_date_time"
      delegate_to: localhost
      run_once: true

    - name: Securely upload database to Amazon S3 bucket
      amazon.aws.s3_object:
        bucket: "flextalk-backups"
        object: "/{{ inventory_hostname }}/{{ inventory_hostname }}-{{ hostvars['localhost']['ansible_date_time']['date'] }}-database.sql"
        src: "/home/ubuntu/flextalk-ansible-backups/{{ inventory_hostname }}/database.sql"
        mode: put
      delegate_to: localhost

    - name: Securely upload site assets to Amazon S3 bucket
      amazon.aws.s3_object:
        bucket: "flextalk-backups"
        object: "/{{ inventory_hostname }}/{{ inventory_hostname }}-{{ hostvars['localhost']['ansible_date_time']['date'] }}-files.tar.gz"
        src: "/home/ubuntu/flextalk-ansible-backups/{{ inventory_hostname }}/site-files.tar.gz"
        mode: put
      delegate_to: localhost
