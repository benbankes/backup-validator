# This playbook can be used to create a backup of the files and database of a website
# Key steps:
# - Snapshot the database, placing it in a .tar.gz archive
# - Append the web files to a folder within the archive, ignoring unreadable files
# - Compress the archive (gzip)
# - Upload it to S3

- name: Grant remote access to machines from which backups are being taken
  hosts: all
  gather_facts: false
  tasks:
    - name: Ensure backup server has credentials to the machine from which the backups are being taken
      ansible.builtin.authorized_key:
        user: "{{ ansible_user }}"
        state: present
        key: "{{ lookup('ansible.builtin.file', '/home/ubuntu/.ssh/id_rsa.pub') }}"

- name: Backup site
  hosts: all
  gather_facts: false

  tasks:
    - name: Ensure orchestrator host-isolated download folder is clean
      ansible.builtin.file:
        path: "/home/ubuntu/flextalk-ansible-backups/{{ inventory_hostname }}"
        state: absent
      delegate_to: localhost

    - name: Clear old staging directories on target server
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/ansible-backup-archives"
        state: absent

    - name: Create fresh staging directories on target server
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/ansible-backup-archives"
        state: directory
        mode: "0755"

    - name: Generate production database snapshot safely
      ansible.builtin.command: >
        mysqldump {{ mysql_database }}
        --host={{ mysql_host }}
        --user={{ mysql_user }}
        --result-file=/home/{{ ansible_user }}/ansible-backup-archives/database.sql
      environment:
        MYSQL_PWD: "{{ mysql_pass }}"

    - name: Step 1 - Add database.sql to the root of a raw tar archive
      ansible.builtin.command: >
        tar -cf /home/{{ ansible_user }}/ansible-backup-archives/archive.tar
        -C /home/{{ ansible_user }}/ansible-backup-archives
        database.sql

    - name: Step 2 - Append website files into a dynamic 'files' subdirectory (skipping permission-locked files)
      ansible.builtin.command: >
        tar -rf /home/{{ ansible_user }}/ansible-backup-archives/archive.tar
        --ignore-failed-read
        --transform 's|^{{ inventory_hostname }}|files|'
        -C /home/{{ ansible_user }}
        {{ inventory_hostname }}
      register: tar_append_result
      failed_when: tar_append_result.rc not in [0, 1] # 0 = Success, 1 = Minor, non-fatal anomalies, e.g. "Some files differ" (e.g. from failure to read some files)

    - name: Step 3 - Compress the composite archive directly on the target drive
      ansible.builtin.command: >
        gzip -f /home/{{ ansible_user }}/ansible-backup-archives/archive.tar

    - name: Pull unified compressed backup archive back to orchestrator
      ansible.builtin.fetch:
        src: "/home/{{ ansible_user }}/ansible-backup-archives/archive.tar.gz"
        dest: "/home/ubuntu/flextalk-ansible-backups/{{ inventory_hostname }}/archive.tar.gz"
        flat: true

    - name: Collect timestamp facts from orchestrator environment
      ansible.builtin.setup:
        filter: "ansible_date_time"
      delegate_to: localhost
      run_once: true

    - name: Securely upload database to Amazon S3 bucket
      amazon.aws.s3_object:
        bucket: "flextalk-backups"
        object: "/{{ inventory_hostname }}/{{ inventory_hostname }}-{{ hostvars['localhost']['ansible_date_time']['date'] }}.tar.gz"
        src: "/home/ubuntu/flextalk-ansible-backups/{{ inventory_hostname }}/archive.tar.gz"
        mode: put
      delegate_to: localhost
