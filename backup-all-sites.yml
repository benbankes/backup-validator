# This playbook can be used to create a backup of the files and database of a website
# Key steps:
# - Snapshot the database.
# - Stream database and website assets into a single compressed archive on the fly.
#   - Ignore unreadable files.
#   - Put web files in their own folder.
# - Upload it to S3

- name: Grant remote access to machines from which backups are being taken
  hosts: all
  gather_facts: false
  tasks:
    - name: Ensure backup server has credentials to the machine from which the backups are being taken
      ansible.builtin.authorized_key:
        user: "{{ ansible_user }}"
        state: present
        key: "{{ lookup('ansible.builtin.file', '/home/ubuntu/.ssh/id_rsa.pub') }}"

- name: Backup site
  hosts: all
  gather_facts: false

  tasks:
    - name: Ensure orchestrator host-isolated download folder is clean
      ansible.builtin.file:
        path: "/home/ubuntu/multi-site-backups/{{ inventory_hostname }}"
        state: absent
      delegate_to: localhost

    - name: Clear old staging directories on target server
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/ansible-backup-archives"
        state: absent

    - name: Create fresh staging directories on target server
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/ansible-backup-archives"
        state: directory
        mode: "0755"

    - name: Generate production database snapshot safely
      ansible.builtin.command: >
        mysqldump {{ mysql_database }}
        --host={{ mysql_host }}
        --user={{ mysql_user }}
        --result-file=/home/{{ ansible_user }}/ansible-backup-archives/database.sql
      environment:
        MYSQL_PWD: "{{ mysql_pass }}"

    - name: Stream database and website assets into a single compressed archive on the fly
      ansible.builtin.shell: >
        GZIP="-1" tar -czf /home/{{ ansible_user }}/ansible-backup-archives/archive.tar.gz
        --ignore-failed-read
        -C /home/{{ ansible_user }}/ansible-backup-archives database.sql
        --transform 's|^{{ inventory_hostname }}|files|'
        -C /home/{{ ansible_user }} {{ inventory_hostname }}
      register: tar_result
      failed_when: tar_result.rc not in [0, 1] # 0 = Success, 1 = Minor, non-fatal anomalies, e.g. "Some files differ" (e.g. from failure to read some files)

    - name: Ensure orchestrator host-isolated download folder exists
      ansible.builtin.file:
        path: "/home/ubuntu/multi-site-backups/{{ inventory_hostname }}"
        state: directory
        mode: "0755"
      delegate_to: localhost

    # Leverage the orchestrator to pipe/stream the archive directly from the production host to S3
    - name: Pipe archive download directly into Amazon S3 simultaneously
      ansible.builtin.shell: >
        sshpass -e 
        ssh -o StrictHostKeyChecking=no -o IdentitiesOnly=yes 
        {{ ansible_user }}@{{ ansible_host }} 
        "cat /home/{{ ansible_user }}/ansible-backup-archives/archive.tar.gz" 
        | aws s3 cp - 
        s3://flextalk-backups/{{ inventory_hostname }}/{{ inventory_hostname }}-{{ lookup('ansible.builtin.pipe', 'date +%Y-%m-%d') }}.tar.gz
      delegate_to: localhost
      # This block passes the password directly into memory, hiding it from process logs
      environment:
        SSHPASS: "{{ ansible_password }}"
